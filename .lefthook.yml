pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,jsx,ts,tsx,json,md,mjs,cjs}"
      run: bunx oxlint --fix {staged_files} || true
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

# Neither turbo nor Next evicts its own on-disk cache, so both grow forever —
# `.turbo/cache` reached 283 GB here. These hooks fire on the infrequent
# operations (pull, branch switch); the script itself no-ops in milliseconds
# unless a day has passed, so it never sits in front of your work.
post-merge:
  commands:
    prune-caches:
      run: bash scripts/dev/prune-caches.sh

post-checkout:
  commands:
    prune-caches:
      run: bash scripts/dev/prune-caches.sh
